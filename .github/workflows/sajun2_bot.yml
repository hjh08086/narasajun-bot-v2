name: Narajangteo Sajun Bot

on:
  schedule:
    - cron: '*/10 * * * *'  # 10분마다 실행
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        env:
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.SAJUN_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.SAJUN_CHAT_ID }}
        run: |
          python sajun_bot.py

      - name: Save sent_sajun_ids cache
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update sent_sajun_ids.json"
          file_pattern: "sent_sajun_ids.json"
          push_options: '--force'
